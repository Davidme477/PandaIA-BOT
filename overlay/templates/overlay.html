<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PandaIA Overlay</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/overlay.css') }}"
    >
</head>

<body>
    <main
        id="overlay-root"
        aria-live="polite"
        aria-atomic="true"
    >
        <section id="gift-stage">

            <div id="ambient-light"></div>
            <div id="flash-effect"></div>

            <article
                id="gift-container"
                class="gift-container"
                aria-hidden="true"
            >
                <div id="gift-glow"></div>

                <div id="gift-ring">
                    <div id="gift-content">
                        <img
                            id="gift-image"
                            src=""
                            alt=""
                            draggable="false"
                        >
                    </div>
                </div>

                <div id="gift-info">
                    <span id="gift-sender"></span>
                    <strong id="gift-name"></strong>
                </div>
            </article>

        </section>
        <section id="member-level-stage" class="member-stage" aria-hidden="true">
            <div id="member-particles" class="member-particles"></div>
            <div class="member-celebration">
                <h1 id="member-title"></h1>
                <div class="member-badge"><img id="member-avatar" alt=""><strong id="member-level"></strong></div>
                <h2 id="member-subtitle"></h2>
            </div>
            <div class="rocket" aria-hidden="true"><span>🚀</span><i></i></div>
            <div class="member-burst" aria-hidden="true"></div>
        </section>
        <section id="member-ranking-stage" class="ranking-stage" aria-hidden="true">
            <div id="ranking-wheels" class="ranking-wheels"></div>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='js/overlay.js') }}"
    ></script>
</body>
</html>
